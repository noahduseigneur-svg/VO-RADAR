<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0f0f11"/>

  <!-- Outer ring glow -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#f43f5e" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Crosshair -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="white" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="white" stroke-opacity="0.05" stroke-width="0.5"/>

  <!-- Arc R=5 : (16,11) → (21,16) -->
  <path d="M16 11 A5 5 0 0 1 21 16" fill="none" stroke="#f43f5e" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round"/>
  <!-- Arc R=9 : (16,7) → (25,16) -->
  <path d="M16 7 A9 9 0 0 1 25 16" fill="none" stroke="#f43f5e" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Arc R=13 : (16,3) → (29,16) -->
  <path d="M16 3 A13 13 0 0 1 29 16" fill="none" stroke="#f43f5e" stroke-opacity="0.92" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Sweep line -->
  <line x1="16" y1="16" x2="25.5" y2="6.5" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Blip halo -->
  <circle cx="25" cy="7" r="3.2" fill="#f43f5e" fill-opacity="0.14"/>
  <!-- Blip dot -->
  <circle cx="25" cy="7" r="1.8" fill="#f43f5e"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.3" fill="#f43f5e" fill-opacity="0.8"/>
</svg>
